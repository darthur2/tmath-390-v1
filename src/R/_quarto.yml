project:
  type: website
  output-dir: ../../site
  resources:
    - .nojekyll
    - assets/**

website:
  title: "TMath 390"
  description: "Mathematical Statistics with R"
  search: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: lectures/index.qmd
        text: Lectures
      - href: homework/index.qmd
        text: Homework
      - href: solutions/index.qmd
        text: Solutions
  page-footer:
    left: "TMath 390 · Mathematical Statistics with R"
    right: "University of Washington Tacoma"

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true
    embed-resources: false
