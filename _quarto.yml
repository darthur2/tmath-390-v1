project:
  type: website
  output-dir: _site
  resources:
    - resources/downloads/**
    - data/*.csv
    - apps/**

website:
  title: "TMath 390"
  description: "Mathematical Statistics with R"
  search: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: schedule.qmd
        text: Schedule
      - href: lectures/index.qmd
        text: Lectures
      - href: homework/index.qmd
        text: Homework
      - href: solutions/index.qmd
        text: Solutions
      - href: resources/index.qmd
        text: Resources
    right:
      - text: Learning Objectives
        href: objectives.qmd
  page-footer:
    left: "TMath 390 · Mathematical Statistics with R"
    right: "University of Washington Tacoma"

format:
  html:
    theme: cosmo
    css: assets/styles.scss
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true
    embed-resources: false

execute:
  freeze: auto
